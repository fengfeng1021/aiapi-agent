[package]
name = "deepseek-harness-desktop"
version = "0.1.12"
description = "Desktop carrier for DeepSeek Harness"
authors = ["DeepSeek Harness Community"]
license = "MIT"
repository = "https://github.com/bailang1218/deepseek-harness-desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deepseek-harness-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
flate2 = "1.1.9"
open = "5.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = { version = "0.4.46", default-features = false }
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
junction = { version = "2.0.0", default-features = false }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
