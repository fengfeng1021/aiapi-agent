[package]
name = "codex-moa"
version = "0.1.0"
edition = "2021"
description = "Mixture-of-Agents virtual provider for Aiapi Agent - ports Hermes moa_loop.py + moa_config.py"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
pretty_assertions = "1"
